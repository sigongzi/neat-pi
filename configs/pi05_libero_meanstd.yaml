# pi05 + LIBERO 微调配置：MEAN_STD 合同，对齐 eval_pi05_libero_finetuned.yaml
# 的预处理合同（旧 finetuned checkpoint 的训练表示）。
# 命令行只传 --config 指向本文件，其余超参数一律在这里改，不硬编码。
#
# 与 configs/pi05_libero.yaml（SE(3) delta / rot6D 表示）的区别：
# - 无 SE3StateActionStep，state/action 直接用原始表示：8 维 state
#   [pos(3), axis-angle(3), gripper qpos(2)] + 7 维 action；
# - MEAN_STD 归一化（统计量取自旧 checkpoint 的 normalizer safetensors）；
# - 3 路 VISUAL feature：2 路真实相机 + empty_camera_0（评测侧填 -1 且
#   mask=False，见 eval/observation.py）。
#
# 训练侧适配（均已在不含训练循环的情况下验证过）：
# - state 窗口：build_dataset 按 preprocessor 是否含 SE3StateActionStep
#   决定取 horizon+1 帧或当前帧（见 uses_se3）；
# - 相机槽位：build_dataset 允许数据集相机数少于 num_cameras（超出报错），
#   缺少槽位由 prepare_batch 在 preprocessor 后注入 empty camera（-1 填充、
#   mask=False、排在真实相机之后），与评测合同一致；mask 语义由
#   test_masked_camera_slot_is_inert 端到端验证。

device:
  type: cuda            # cuda | npu；backend.py 据此选 nccl/hccl、autocast 等
  dtype: bfloat16       # 训练混合精度

model:
  image_size: 224
  num_cameras: 3        # 模型输入槽位：2 路真实相机（agentview + wrist）+ empty_camera_0（eval 同义）
  action_horizon: 50    # 旧 checkpoint 的 n_action_steps（eval 每次执行前 10 步）
  action_dim: 32        # pi05 动作专家的动作维度上限（7 维 action 右侧补零）

data:
  repo_id: libero       # 仅作标识；实际从本地路径加载
  root: /home/ivoryseagull/neat-pi-old/data/lerobot/libero
  per_device_batch_size: 8
  num_workers: 4
  # 预处理合同与 eval_pi05_libero_finetuned_preprocessor.json 逐步一致（仅
  # name 不同）；normalizer 统计 / tokenizer 词表取自旧 finetuned checkpoint，
  # 保证与权重训练时一致
  preprocessor_path: configs/pi05_libero_meanstd_preprocessor.json
  postprocessor_path: configs/pi05_libero_meanstd_postprocessor.json
  max_token_len: 200    # pi05 约定（openpi pi0_config: pi05 分支 max_token_len=200）

training:
  # 直接微调旧 checkpoint：其训练合同（8 维 state + 7 维 action + MEAN_STD）
  # 与本文件的数据表示一致，无需表示对齐
  use_dummy_model: false
  pretrained: /home/ivoryseagull/neat-pi-old/checkpoints/pi05_libero_finetuned
  max_steps: 10000
  lr: 2.5e-5
  # cosine 调度（src/neat_pi/training/scheduler.py）：warmup 线性升温，
  # 随后衰到 lr_end，衰减终点绑 max_steps（训完恰衰到 lr_end）
  lr_end: 2.5e-6       # openpi decay_lr 默认（lr/10）
  warmup_steps: 1000   # openpi 默认
  # EMA 影子权重（docs/plan/11-ema.md）：每 optimizer step 向训练参数滑动，
  # checkpoint 双份落盘（model.safetensors + ema.safetensors）；null 关闭
  ema_decay: 0.999
  weight_decay: 0.0
  log_every: 10
  save_every: 1000
  # checkpoint 保留策略（prune_checkpoints）：只留最近 3 份 + 里程碑，
  # 防止 ~40GB/份的 full checkpoint 撑爆磁盘；0/0 = 不清理
  keep_last_n: 3
  keep_every: 2000
  output_dir: outputs/pi05_libero_meanstd
  fsdp:
    sharding_strategy: full_shard   # full_shard | shard_grad_op | no_shard
    use_orig_params: true           # MoT 结构下配合 auto_wrap 使用
