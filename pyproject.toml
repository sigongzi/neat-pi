[project]
name = "neat-pi"
version = "0.1.0"
description = "纯 PyTorch 复现 pi05：权重格式兼容 / LeRobot v3.1 数据 / FSDP 多机训练 / 昇腾适配"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7, <2.10",          # 模型与训练核心（唯一的重型依赖）
    "torchtyping>=0.1.5",  # 张量形状类型标注（AGENTS.md 规范要求）
    "typeguard>=2.13",     # 运行时类型校验，torchtyping 的形状断言依赖它
    "safetensors>=0.4",    # 以 memory-mapped 方式读取 pi05 checkpoint
    "lerobot[dataset] >= 0.5",    # LeRobot 数据加载（数据集格式 v3.1）
    "pyyaml>=6.0",         # 读取 configs/*.yaml 配置
    "loguru>=0.7",         # 统一日志（全项目不用标准库 logging / print）
    "numpy>=1.26",         # 数据管线的数值处理
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
libero = [
    "lerobot[libero]>=0.5",  # LIBERO rollout 仿真栈，仅评测入口需要
]

[dependency-groups]
dev = [
    "pytest>=8.0",  # 单元测试（tests/ 目录）
    "matplotlib>=3.8",  # 子任务探测可视化（tmp_scripts/vis_subtask_probe.py）
]

[tool.hatch.build.targets.wheel]
packages = ["src/neat_pi"]
